[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-duration"
version = "0.1.0"
description = "Production-style ML service for NYC taxi trip duration prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyarrow>=15.0",
  "mlflow>=2.10",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]
eda = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.scripts]
taxi-duration = "taxi_duration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
